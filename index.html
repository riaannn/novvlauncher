<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovOS</title>

  <style>
    :root {
      --black: #050505;
      --dark: #0b0b0b;
      --gray: #151515;
      --gray2: #242424;
      --silver: #bcbcbc;
      --light: #e8e8e8;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at 50% 40%,
          #202020 0%,
          #0d0d0d 38%,
          #050505 75%,
          #000000 100%
        );
      color: var(--white);
    }

    /* Background */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.025) 35%,
          transparent 70%
        );

      filter: blur(20px);
    }

    .grid {
      position: absolute;
      left: -20%;
      bottom: -30%;
      width: 140%;
      height: 70%;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      transform:
        perspective(500px)
        rotateX(62deg);

      transform-origin: center top;
      opacity: 0.5;
    }

    .noise {
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(
          rgba(255, 255, 255, 0.12) 1px,
          transparent 1px
        );

      background-size: 4px 4px;
      opacity: 0.025;
    }

    /* Floating particles */

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      animation: float 8s infinite ease-in-out;
    }

    .particle:nth-child(1) {
      left: 15%;
      top: 25%;
      animation-delay: -2s;
    }

    .particle:nth-child(2) {
      left: 80%;
      top: 20%;
      animation-delay: -5s;
    }

    .particle:nth-child(3) {
      left: 70%;
      top: 70%;
      animation-delay: -1s;
    }

    .particle:nth-child(4) {
      left: 25%;
      top: 75%;
      animation-delay: -6s;
    }

    .particle:nth-child(5) {
      left: 90%;
      top: 50%;
      animation-delay: -3s;
    }

    .particle:nth-child(6) {
      left: 10%;
      top: 55%;
      animation-delay: -7s;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) scale(1);
        opacity: 0.2;
      }

      50% {
        transform: translateY(-25px) scale(1.5);
        opacity: 0.8;
      }
    }

    /* Main layout */

    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
    }

    .launch-card {
      position: relative;
      width: min(620px, 94vw);

      padding: 55px 45px 45px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.025)
        );

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

      text-align: center;
    }

    .launch-card::before {
      content: "";
      position: absolute;
      inset: 0;

      border-radius: inherit;

      background:
        linear-gradient(
          120deg,
          transparent 20%,
          rgba(255, 255, 255, 0.04),
          transparent 80%
        );

      pointer-events: none;
    }

    /* Browser logo */

    .logo-container {
      position: relative;

      width: 260px;
      height: 260px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;

      width: 230px;
      height: 230px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.14),
          transparent 68%
        );

      filter: blur(20px);

      animation:
        logoPulse 5s ease-in-out infinite;

      will-change: transform, opacity;
    }

    @keyframes logoPulse {
      0%,
      100% {
        transform: scale(0.97);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.04);
        opacity: 0.75;
      }
    }

    .logo {
      position: relative;

      width: 240px;
      height: 240px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: visible;
    }

    /* Globe */

    .globe {
      position: relative;

      width: 190px;
      height: 190px;

      border-radius: 50%;

      border: 3px solid rgba(255, 255, 255, 0.82);

      background:
        radial-gradient(
          circle at 32% 28%,
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0.045) 48%,
          rgba(0, 0, 0, 0.45) 100%
        );

      box-shadow:
        inset -25px -25px 45px rgba(0, 0, 0, 0.55),
        inset 15px 15px 35px rgba(255, 255, 255, 0.06),
        0 0 35px rgba(255, 255, 255, 0.09);

      /*
        Slow floating motion.
        This is separate from the globe's internal rotation
        so the two animations don't fight each other.
      */
      animation:
        globeFloat 7s cubic-bezier(0.45, 0, 0.55, 1) infinite;

      will-change: transform;
    }

    @keyframes globeFloat {
      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      50% {
        transform: translate3d(0, -6px, 0);
      }
    }

    /* Longitude */

    .globe::before {
      content: "";

      position: absolute;
      inset: 17px;

      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;

      transform-origin: center;

      animation:
        longitudeRotate 10s linear infinite;

      will-change: transform;
    }

    @keyframes longitudeRotate {
      from {
        transform: scaleX(0.42);
      }

      50% {
        transform: scaleX(0.62);
      }

      to {
        transform: scaleX(0.42);
      }
    }

    /* Outer latitude */

    .globe::after {
      content: "";

      position: absolute;

      left: 15px;
      right: 15px;

      top: 50%;

      height: 58px;

      transform: translateY(-50%);

      border-top: 2px solid rgba(255, 255, 255, 0.18);
      border-bottom: 2px solid rgba(255, 255, 255, 0.13);

      border-radius: 50%;

      animation:
        latitudeRotate 10s linear infinite;

      will-change: transform;
    }

    @keyframes latitudeRotate {
      from {
        transform:
          translateY(-50%)
          scaleY(1);
      }

      50% {
        transform:
          translateY(-50%)
          scaleY(0.72);
      }

      to {
        transform:
          translateY(-50%)
          scaleY(1);
      }
    }

    /* Additional latitude lines */

    .latitude {
      position: absolute;

      left: 25px;
      right: 25px;

      height: 55px;

      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

      border-radius: 50%;
    }

    .latitude.one {
      top: 34px;
    }

    .latitude.two {
      bottom: 34px;
    }

    /* Shine */

    .globe-shine {
      position: absolute;

      width: 38px;
      height: 38px;

      top: 27px;
      left: 33px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.28),
          transparent 70%
        );

      filter: blur(5px);

      animation:
        shinePulse 6s ease-in-out infinite;

      will-change: transform, opacity;
    }

    @keyframes shinePulse {
      0%,
      100% {
        opacity: 0.65;
        transform: scale(1);
      }

      50% {
        opacity: 0.9;
        transform: scale(1.08);
      }
    }

    /* Text */

    .title {
      position: relative;

      font-size: 52px;
      font-weight: 700;

      letter-spacing: -2px;

      margin-bottom: 10px;

      background:
        linear-gradient(
          180deg,
          #ffffff,
          #8c8c8c
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .subtitle {
      color: #8d8d8d;

      font-size: 15px;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 38px;
    }

    /* Button */

    .launch-button {
      position: relative;

      width: 100%;
      height: 58px;

      border: 1px solid rgba(255, 255, 255, 0.2);

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #eeeeee,
          #a8a8a8
        );

      color: #050505;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: 1px;

      cursor: pointer;

      overflow: hidden;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }

    .launch-button::before {
      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 60%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.5),
          transparent
        );

      transform: skewX(-20deg);

      transition: left 0.6s ease;
    }

    .launch-button:hover::before {
      left: 140%;
    }

    .launch-button:hover:not(:disabled) {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(255, 255, 255, 0.1);

      filter: brightness(1.08);
    }

    .launch-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .launch-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .button-arrow {
      display: inline-block;

      margin-left: 8px;

      font-size: 18px;

      transition:
        transform 0.2s ease;
    }

    .launch-button:hover .button-arrow {
      transform: translateX(5px);
    }

    /* Footer */

    .footer {
      margin-top: 25px;

      color: #555;

      font-size: 11px;

      letter-spacing: 1px;
    }

    /* Responsive */

    @media (max-width: 600px) {
      .launch-card {
        padding: 35px 25px 30px;
        border-radius: 22px;
      }

      .logo-container {
        transform: scale(0.82);
        margin-bottom: -10px;
      }

      .title {
        font-size: 42px;
      }

      .subtitle {
        font-size: 12px;
        letter-spacing: 2px;
        margin-bottom: 30px;
      }
    }

    /* Reduced motion */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="noise"></div>

    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <main class="page">

    <section class="launch-card">

      <div class="logo-container">

        <div class="logo-glow"></div>

        <div class="logo">

          <div class="globe">

            <div class="latitude one"></div>
            <div class="latitude two"></div>

            <div class="globe-shine"></div>

          </div>

        </div>

      </div>

      <h1 class="title">
        NovOS
      </h1>

      <p class="subtitle">
        Cloaking moved to main OS
      </p>

      <button
        class="launch-button"
        id="launchBtn"
        disabled
      >
        Preparing...
      </button>

      <div class="footer">
        A FULLY VIBECODED OS
      </div>

    </section>

  </main>

  <script>
    const DEFAULT_RAW_URL =
      "https://raw.githubusercontent.com/riaannn/NovOS/refs/heads/main/index.html";

    const params =
      new URLSearchParams(location.search);

    const RAW_URL =
      params.get("rawURL") ||
      params.get("rawUrl") ||
      params.get("url") ||
      DEFAULT_RAW_URL;

    const RAW_HTML =
      params.get("__rawhtml__") || "";

    const HAS_TARGET =
      (RAW_HTML && RAW_HTML.trim()) ||
      (RAW_URL && RAW_URL.trim());

    const launchBtn =
      document.getElementById("launchBtn");

    function baseDirOf(url) {
      try {
        const u = new URL(url);

        u.search = "";
        u.hash = "";

        u.pathname =
          u.pathname.replace(
            /[^/]*$/,
            ""
          );

        return u.href;

      } catch (e) {
        return "";
      }
    }

    function injectBase(html, href) {
      if (!href) {
        return html;
      }

      const baseTag =
        `<base href="${href.replace(/"/g, "&quot;")}">`;

      html =
        html.replace(
          /<base\b[^>]*>/i,
          ""
        );

      if (/<head[^>]*>/i.test(html)) {
        return html.replace(
          /<head([^>]*)>/i,
          `<head$1>${baseTag}`
        );
      }

      if (/<html[^>]*>/i.test(html)) {
        return html.replace(
          /<html([^>]*)>/i,
          `<html$1><head>${baseTag}</head>`
        );
      }

      return baseTag + html;
    }

    async function resolveHTML() {

      if (
        RAW_HTML &&
        RAW_HTML.trim()
      ) {
        return RAW_HTML;
      }

      if (
        RAW_URL &&
        RAW_URL.trim()
      ) {

        const response =
          await fetch(
            RAW_URL,
            {
              mode: "cors",
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "HTTP " +
            response.status
          );
        }

        const html =
          await response.text();

        return injectBase(
          html,
          baseDirOf(RAW_URL)
        );
      }

      return `
        <h1>No target content available</h1>
      `;
    }

    window.addEventListener(
      "DOMContentLoaded",
      () => {

        if (HAS_TARGET) {

          launchBtn.disabled = false;

          launchBtn.innerHTML =
            `Open NovOS <span class="button-arrow">→</span>`;

        } else {

          launchBtn.textContent =
            "No Target Configured";

        }
      }
    );

    launchBtn.addEventListener(
      "click",
      async () => {

        if (!HAS_TARGET) {
          launchBtn.textContent =
            "No target configured";
          return;
        }

        launchBtn.disabled = true;
        launchBtn.textContent = "Launching...";

        const win =
          window.open(
            "about:blank",
            "_blank"
          );

        try {

          const rawContent =
            await resolveHTML();

          if (win) {

            const doc =
              win.document;

            doc.open();

            doc.write(
              rawContent
            );

            doc.title = "NovOS";

            let link =
              doc.querySelector(
                "link[rel*='icon']"
              );

            if (!link) {

              link =
                doc.createElement("link");

              link.rel =
                "shortcut icon";

              const head =
                doc.getElementsByTagName(
                  "head"
                )[0];

              if (head) {
                head.appendChild(link);
              }
            }

            if (link) {
              link.href =
                "https://www.google.com/favicon.ico";
            }

            const script =
              doc.createElement("script");

            script.textContent = `
              window.addEventListener(
                "beforeunload",
                function(e) {
                  e.preventDefault();
                  e.returnValue = "";
                  return "";
                }
              );
            `;

            if (doc.body) {
              doc.body.appendChild(script);

            } else if (doc.head) {
              doc.head.appendChild(script);
            }

            doc.close();
          }

          setTimeout(
            () => {

              launchBtn.disabled = false;

              launchBtn.innerHTML =
                `Open NovOS <span class="button-arrow">→</span>`;

            },
            1000
          );

        } catch (error) {

          if (win) {
            win.close();
          }

          alert(
            "Failed to load target app: " +
            String(
              error &&
              error.message ||
              error
            )
          );

          launchBtn.disabled = false;

          launchBtn.innerHTML =
            `Open NovOS <span class="button-arrow">→</span>`;
        }
      }
    );
  </script>

</body>
</html>
