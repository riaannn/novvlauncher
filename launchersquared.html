<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovOS</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0c10;
      color: #ffffff;
    }
    .card {
      background-color: #16171d;
      border: 1px solid #23252e;
      border-radius: 16px;
      padding: 28px;
      width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 4px 0;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #8b8e9b;
      margin: 0 0 20px 0;
    }
    .launch-btn {
      width: 100%;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(90deg, #7b75ff, #3b82f6);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 15px rgba(123, 117, 255, 0.3);
    }
    .launch-btn:hover {
      opacity: 0.92;
    }
    .launch-btn:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title"></h1>
    <p class="subtitle"></p>

    <button class="launch-btn" onclick="launchApp()">Open Launcher</button>
  </div>

  <script>
    function launchApp() {
      const targetUrl = "https://esm.sh/gh/riaannn/novvlauncher@42366b5/thingylauncher.html";
      const win = window.open("about:blank", "_blank");
      
      if (!win) {
        alert("Please allow popups for this site to open the launcher.");
        return;
      }

      const doc = win.document;
      doc.open();
      doc.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8" />
          <title>Classes</title>
          <style>
            html, body {
              margin: 0;
              padding: 0;
              width: 100vw;
              height: 100vh;
              overflow: hidden;
              background-color: #000;
            }
            iframe {
              width: 100%;
              height: 100%;
              border: none;
              display: block;
            }
          </style>
        </head>
        <body>
          <iframe src="${targetUrl}"></iframe>
          <script>
            window.addEventListener("beforeunload", function (e) {
              e.preventDefault();
              e.returnValue = "";
              return "";
            });
          <\/script>
        </body>
        </html>
      `);
      doc.close();
    }
  </script>

</body>
</html>
