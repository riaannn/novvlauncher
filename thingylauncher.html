<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovOS Launcher</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .landing {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .launch-card {
      width: min(400px, 90vw);
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      background: #0b0b0b;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .launch-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #050505;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .launch-button:hover {
      background: #d0d0d0;
    }
  </style>
</head>
<body>

  <div class="landing" id="landingScreen">
    <div class="launch-card">
      <h1>NovOS</h1>
      <p></p>
      <button class="launch-button" id="launchBtn">Launch</button>
    </div>
  </div>

  <script>
    // Paste your entire NovOS index.html code inside this string:
    const novOSCode = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NovOS</title>
</head>
<body style="background:#111; color:#fff; font-family:sans-serif; text-align:center; padding-top:20vh;">
  <h1>NovOS is Running Successfully!</h1>
  <p>Your local storage and progress are now locked to this esm.sh URL origin.</p>
</body>
</html>`;

    document.getElementById("launchBtn").addEventListener("click", () => {
      // 1. Open about:blank synchronously to bypass popup blockers
      const newWindow = window.open("about:blank", "_blank");

      if (!newWindow) {
        alert("Popup blocked! Please allow popups for this site.");
        return;
      }

      // 2. Write the HTML directly into the new tab
      newWindow.document.open();
      newWindow.document.write(novOSCode);
      newWindow.document.title = "NovOS";
      newWindow.document.close();

      // 3. Add beforeunload persistence prompt
      newWindow.addEventListener("beforeunload", (event) => {
        event.preventDefault();
        event.returnValue = "";
      });
    });
  </script>

</body>
</html>
