<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovOS Launcher</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .landing {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .launch-card {
      width: min(400px, 90vw);
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      background: #0b0b0b;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .launch-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #050505;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .launch-button:hover {
      background: #d0d0d0;
    }
  </style>
</head>
<body>

  <div class="landing" id="landingScreen">
    <div class="launch-card">
      <h1>NovOS</h1>
      <p></p>
      <button class="launch-button" id="launchBtn">Launch</button>
    </div>
  </div>

  <script>
    const RAW_URL = "https://raw.githubusercontent.com/riaannn/NovOS/main/index.html";

    document.getElementById("launchBtn").addEventListener("click", () => {
      // 1. OPEN THE WINDOW SYNCHRONOUSLY RIGHT AWAY (bypasses popup blocker completely)
      const newWindow = window.open("about:blank", "_blank");

      if (!newWindow) {
        alert("Popup blocked! Please allow popups for this site.");
        return;
      }

      // Show a temporary loading message inside the new blank tab while it fetches
      newWindow.document.write("<h2 style='color:white;background:black;font-family:sans-serif;text-align:center;padding-top:20vh;'>Loading NovOS...</h2>");

      // 2. Fetch the code in the background and write it once ready
      fetch(RAW_URL, { cache: "no-store" })
        .then(response => {
          if (!response.ok) throw new Error("HTTP error " + response.status);
          return response.text();
        })
        .then(html => {
          newWindow.document.open();
          newWindow.document.write(html);
          newWindow.document.title = "NovOS";
          newWindow.document.close();

          // 3. Add beforeunload persistence prompt
          newWindow.addEventListener("beforeunload", (event) => {
            event.preventDefault();
            event.returnValue = "";
          });
        })
        .catch(error => {
          newWindow.document.open();
          newWindow.document.write("<h2 style='color:red;background:black;font-family:sans-serif;text-align:center;padding-top:20vh;'>Failed to load NovOS: " + error.message + "</h2>");
          newWindow.document.close();
        });
    });
  </script>

</body>
</html>
